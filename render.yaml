services:
  - type: web
    name: raw-material-market-dashboard
    env: node
    plan: free
    buildCommand: "npm ci"
    startCommand: "npm start"
    healthCheckPath: "/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DURABLE_STORAGE
        value: "1"
      - key: STORAGE_PROVIDER
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
