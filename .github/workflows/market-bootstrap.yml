name: Market Production Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      STORAGE_PROVIDER: postgres
      DATABASE_SSL: "true"
      REQUIRE_DURABLE_STORAGE: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKET_TIMEOUT_MS: "10000"
      MARKET_RETRIES: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate code
        run: npm run check
      - name: Migrate PostgreSQL schema
        run: npm run db:migrate
      - name: Verify database and storage readiness
        run: npm run production:storage-check
      - name: Bootstrap public history
        run: npm run production:bootstrap -- --period 3y
      - name: Verify bootstrap status
        run: npm run production:status
